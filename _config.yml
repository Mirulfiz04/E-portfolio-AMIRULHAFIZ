# GitHub Pages builds this site with Jekyll but the site itself is plain HTML, CSS and JS.
# Keep the developer tooling (lint, tests, scripts) out of what gets published.
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - eslint.config.js
  - playwright.config.js
  - playwright-report
  - test-results
  - scripts
  - tests
  - docs
  - backend
  - CONTRIBUTING.md
