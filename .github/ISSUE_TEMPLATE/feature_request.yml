name: Feature or improvement
description: An idea to add or improve something on the site
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What is missing or plain today, and who is it for (visitors, recruiters, me)?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should it do?
      description: Describe it in plain words. A sketch or a link to something similar is welcome.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A short checklist that tells us the work is finished.
      placeholder: |
        - [ ] Works on a phone and on desktop
        - [ ] Looks right in light and dark theme
        - [ ] A test covers it
