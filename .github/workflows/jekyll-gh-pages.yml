name: CI/CD

# The one pipeline that puts the site live. Every step waits for the one before it:
#
#   push to main  ->  CI  ->  build  ->  deploy  ->  verify the live site
#
#   CI      the same checks every pull request gets (ci.yml): lint, HTML, assets, browser tests
#   build   Jekyll builds the site (tests and tooling are left out, see _config.yml)
#   deploy  publishes to GitHub Pages. Only ever from main, never from another branch.
#   verify  fetches the live site and proves it is serving this commit and is healthy
#
# If CI fails nothing is built or deployed, and the site keeps serving the last good version.
# Pull requests only run CI (ci.yml). To roll back, revert the merge on GitHub: this pipeline redeploys the reverted state.
on:
  push:
    branches: ["main"]

  # Run it by hand from the Actions tab. From any branch other than main it runs CI and build but never deploys.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build site
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify the live site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the live site is serving this commit
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-live.mjs
