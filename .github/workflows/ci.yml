name: CI

# Checks every change before it can reach the live site:
#   - on every pull request
#   - as the first stage of the CI/CD pipeline (jekyll-gh-pages.yml), which calls this workflow on every push to main
#     and only builds and deploys if it passes. That is why there is no `push` trigger here: it would run twice.
#   - by hand from the Actions tab
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Lint, HTML and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      - name: Check every referenced file exists
        run: npm run check:assets

  browser-tests:
    name: Browser tests (phone and desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: npx playwright test

      - name: Keep the test report when something fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The AWS backend (backend/) has no npm dependencies and its tests use fakes, so there is nothing to install
  # and no AWS credentials are involved.
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the backend tests
        working-directory: backend
        run: node --test

  # One stable name to require in branch protection, whatever jobs are added later.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [static-checks, browser-tests, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo "static-checks: ${{ needs.static-checks.result }}"
          echo "browser-tests: ${{ needs.browser-tests.result }}"
          echo "backend-tests: ${{ needs.backend-tests.result }}"
          test "${{ needs.static-checks.result }}" = "success" && test "${{ needs.browser-tests.result }}" = "success" && test "${{ needs.backend-tests.result }}" = "success"
