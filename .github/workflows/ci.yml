name: CI

# Checks every change before it can reach the live site:
#   - on every pull request
#   - on every push to main (keeps the README badge honest)
#   - by hand from the Actions tab, or called from another workflow
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Lint, HTML and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      - name: Check every referenced file exists
        run: npm run check:assets

  browser-tests:
    name: Browser tests (phone and desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: npx playwright test

      - name: Keep the test report when something fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # One stable name to require in branch protection, whatever jobs are added later.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [static-checks, browser-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo "static-checks: ${{ needs.static-checks.result }}"
          echo "browser-tests: ${{ needs.browser-tests.result }}"
          test "${{ needs.static-checks.result }}" = "success" && test "${{ needs.browser-tests.result }}" = "success"
